<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Piattino</title>
<meta name="description" content="Organizza la dieta, fotografa quello che mangi e trova ogni giorno una spinta in più. Dai 9 anni in su.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piattino">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
html{color-scheme:light}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --card2:#F2F2F7; --label:#000000; --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16); --fill:rgba(120,120,128,.12); --fill2:rgba(120,120,128,.2);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --pink:#FF2D55; --purple:#AF52DE; --teal:#30B0C7; --indigo:#5856D6;
  --bar:rgba(249,249,249,.84); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 24px rgba(0,0,0,.06);
  --ring-card:#000000; --ring-text:#FFFFFF; --ring-text2:rgba(235,235,245,.62);
  --r-move:#FA114F; --r-ex:#A6FF00; --r-stand:#00D8FE;
  --glow-blue:rgba(0,122,255,.28); --glow-pink:rgba(255,45,85,.3); --glow-green:rgba(52,199,89,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --pink:#FF375F; --purple:#BF5AF2; --teal:#40C8E0; --indigo:#5E5CE6;
    --bar:rgba(18,18,18,.82); --shadow:none; --ring-card:#1C1C1E;
    --glow-blue:rgba(10,132,255,.6); --glow-pink:rgba(255,55,95,.6); --glow-green:rgba(48,209,88,.65);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000; --card:#1C1C1E; --card2:#2C2C2E; --label:#FFFFFF; --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(120,120,128,.24); --fill2:rgba(120,120,128,.36);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --pink:#FF375F; --purple:#BF5AF2; --teal:#40C8E0; --indigo:#5E5CE6;
  --bar:rgba(18,18,18,.82); --shadow:none; --ring-card:#1C1C1E;
  --glow-blue:rgba(10,132,255,.6); --glow-pink:rgba(255,55,95,.6); --glow-green:rgba(48,209,88,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.2px;padding-inline:16px}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:10px}
input,select,textarea{font:inherit;color:var(--label)}
.wrap{max-width:560px;margin:0 auto;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 128px)}
button,.tab,.glass{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{overscroll-behavior-y:none}
.num{font-variant-numeric:tabular-nums}
/* glow */
.large-title{text-shadow:0 0 22px var(--glow-blue)}
.legend .k{text-shadow:0 0 10px currentColor}
.legend .v{text-shadow:0 0 14px rgba(255,255,255,.35)}
.flip-face .q{text-shadow:0 0 18px var(--glow-pink)}
.stat .v{text-shadow:0 0 16px var(--glow-blue)}
.stat.hot .v{color:var(--orange);text-shadow:0 0 16px rgba(255,149,0,.55)}
.target-grid b{text-shadow:0 0 14px var(--glow-blue)}
.stepper input{text-shadow:0 0 18px var(--glow-blue)}
.glow-green{color:#B4FFCB;text-shadow:0 0 12px rgba(108,255,154,.85),0 0 30px rgba(48,209,88,.55)}
.welcome h1{background:linear-gradient(120deg,#FF2D55,#FF9500 40%,#34C759 75%,#30B0C7);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px var(--glow-pink)) drop-shadow(0 0 28px var(--glow-green))}
.scan-desc{width:100%;border-radius:14px;background:rgba(255,255,255,.1);color:#fff;border:0;padding:12px 14px;font:inherit;font-size:17px;resize:none;min-height:88px;outline:none}
.scan-desc::placeholder{color:rgba(235,235,245,.45)}
.conf{color:var(--green);font-weight:600}
.plate video{width:100%;height:100%;object-fit:cover;display:block}
@keyframes pulseGlow{50%{text-shadow:0 0 22px rgba(255,255,255,.6)}}
.legend .v{animation:pulseGlow 3.2s ease-in-out infinite}

/* Header */
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:14px}
.eyebrow{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.4px}
.large-title{font-size:34px;font-weight:700;letter-spacing:.3px;line-height:1.1;margin:2px 0 0;text-wrap:balance}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:16px;color:#fff;background:linear-gradient(160deg,#8E8E93,#636366);flex:none}
.sub{color:var(--label2);font-size:15px;margin:6px 0 0}
.section-title{font-size:22px;font-weight:700;letter-spacing:.2px;margin:28px 4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.section-title small{font-size:15px;font-weight:400;color:var(--label2)}

.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.muted{color:var(--label2)}
.small{font-size:13px}
.foot{font-size:13px;color:var(--label2);margin:8px 4px 0;line-height:1.4}

/* Date switcher */
.datebar{display:flex;align-items:center;gap:6px;margin-top:14px}
.chip-btn{height:34px;min-width:34px;padding:0 12px;border-radius:17px;background:var(--fill);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chip-btn svg{width:16px;height:16px}
.chip-btn.accent{color:var(--blue)}
.chip-btn[disabled]{opacity:.35;cursor:default}
.datebar .label{flex:1;text-align:center;font-weight:600;font-size:15px;text-transform:capitalize}

/* Rings card */
.rings-card{background:var(--ring-card);color:var(--ring-text);border-radius:22px;padding:18px;display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-top:14px;overflow:hidden;position:relative}
.rings{width:150px;height:150px;display:block}
.ring-arc{transition:stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;flex-direction:column;gap:10px;min-width:0}
.legend .k{font-size:13px;font-weight:600;letter-spacing:.2px}
.legend .v{font-family:var(--round);font-size:22px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.legend .v span{font-size:15px;font-weight:500;color:var(--ring-text2)}
.macro-bars{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:.5px solid rgba(255,255,255,.14);padding-top:14px}
.mbar .t{display:flex;justify-content:space-between;font-size:13px;color:var(--ring-text2);gap:6px}
.mbar .t b{color:var(--ring-text);font-weight:600}
.track{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:3px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
@media (max-width:380px){.rings-card{grid-template-columns:1fr;justify-items:center}.legend{width:100%}}

/* Quote flip */
.flip{perspective:1000px;margin-top:12px;cursor:pointer}
.flip-inner{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.3,.5,1);min-height:100px}
.flip-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:center;background:var(--card);box-shadow:var(--shadow)}
.flip-face.back{transform:rotateY(180deg)}
.flip-face .q{font-size:17px;font-weight:600;line-height:1.3;text-wrap:balance}
.flip-face .h{font-size:12px;color:var(--label2);margin-top:4px}
.spark{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#FF9F0A,#FF375F)}
.spark svg{width:24px;height:24px}

/* Water */
.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.glass{width:34px;height:44px;border-radius:8px 8px 12px 12px;background:var(--fill);position:relative;overflow:hidden;transition:transform .2s}
.glass::after{content:"";position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(180deg,#5AC8FA,#007AFF);transition:height .45s cubic-bezier(.2,.8,.2,1)}
.glass.on::after{height:78%}
.glass:active{transform:scale(.9)}

/* Meals */
.meal{padding:4px 0}
.meal-head{display:flex;align-items:center;gap:12px;padding:12px 16px}
.meal-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:#fff;flex:none}
.meal-ico svg{width:19px;height:19px}
.meal-name{font-weight:600}
.meal-kcal{color:var(--label2);font-size:15px}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--blue);display:grid;place-items:center;flex:none}
.add-btn svg{width:18px;height:18px}
.entry{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;position:relative}
.entry::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:.5px solid var(--sep)}
.thumb{width:36px;height:36px;border-radius:9px;background:var(--fill);display:grid;place-items:center;font-size:21px;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.entry .n{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .g{font-size:13px;color:var(--label2)}
.entry .k{font-size:15px;color:var(--label2);font-variant-numeric:tabular-nums;white-space:nowrap}
.empty-line{padding:0 16px 14px 60px;color:var(--label3);font-size:15px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bar);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:58px;padding-inline:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:var(--label3);padding-bottom:6px}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--blue)}
.tab-scan{display:flex;justify-content:center;padding-bottom:8px}
.scan-fab{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;color:#fff;background:radial-gradient(circle at 30% 25%,#5CF08A,#28B84E 60%,#179A3A);box-shadow:0 8px 22px rgba(40,184,78,.45),inset 0 1px 0 rgba(255,255,255,.4);transform:translateY(-8px);transition:transform .2s}
.scan-fab:active{transform:translateY(-8px) scale(.93)}
.scan-fab svg{width:30px;height:30px}

/* Buttons */
.btn{height:50px;border-radius:14px;font-weight:600;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.tinted{background:var(--fill);color:var(--blue)}
.btn.danger{background:var(--fill);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.btn svg{width:20px;height:20px}
.link{color:var(--blue);font-size:17px}

/* Forms (iOS grouped) */
.group{background:var(--card);border-radius:14px;overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.field label{flex:none;width:112px}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;text-align:right;height:46px;outline:none;font-size:17px;color:var(--label)}
.field input::placeholder{color:var(--label3)}
.field input[type=date]{-webkit-appearance:none;appearance:none;display:flex;justify-content:flex-end;min-height:46px;color:var(--blue)}
.field input[type=date]::-webkit-date-and-time-value{text-align:right}
.field .unit{color:var(--label2);flex:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:2px;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label,.seg button{flex:1;text-align:center;font-size:13px;font-weight:500;padding:7px 4px;border-radius:7px;cursor:pointer;line-height:1.2;transition:background .2s}
.seg input:checked+label,.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.14);font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--blue)}
.form-label{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.4px;margin:18px 16px 8px}
.err{color:var(--red);font-size:15px;min-height:20px;margin:10px 4px 0}
.note{background:var(--fill);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--label2);line-height:1.4}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;border-radius:16px;background:var(--fill2);transition:background .25s;pointer-events:none}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15);transition:transform .25s}
.toggle input:checked+span{background:var(--green)}
.toggle input:checked+span::after{transform:translateX(20px)}

/* Sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0);transition:background .3s}
.sheet-wrap.show{background:rgba(0,0,0,.4)}
.sheet{width:100%;max-width:560px;max-height:92%;background:var(--bg);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;overflow:hidden;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-wrap.show .sheet{transform:none}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:6px auto 0;flex:none}
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px 8px;gap:8px;flex:none}
.sheet-head h3{margin:0;font-size:17px;font-weight:600;text-align:center}
.sheet-head .l{justify-self:start}.sheet-head .r{justify-self:end}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;height:38px;margin:8px 0 12px}
.search svg{width:17px;height:17px;color:var(--label2);flex:none}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:17px}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 16px;width:100%;text-align:left;position:relative;background:var(--card)}
.list-item+.list-item::before{content:"";position:absolute;top:0;left:64px;right:0;border-top:.5px solid var(--sep)}
.list-item .chev{color:var(--label3);width:14px;height:14px;flex:none}
.big-food{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0 6px}
.big-food .thumb{width:84px;height:84px;border-radius:22px;font-size:52px}
.big-food h2{margin:0;font-size:22px;text-align:center;text-wrap:balance}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--fill);font-size:24px;color:var(--blue);display:grid;place-items:center}
.stepper input{width:96px;text-align:center;font-family:var(--round);font-size:34px;font-weight:600;border:0;background:transparent;outline:none}
.nutri{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.nutri div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.nutri b{display:block;font-family:var(--round);font-size:19px;font-variant-numeric:tabular-nums}
.nutri span{font-size:11px;color:var(--label2);text-transform:uppercase;letter-spacing:.3px}

/* Plan */
.target-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.target-grid div{text-align:center;padding:10px 4px;border-radius:12px;background:var(--card2)}
.target-grid b{display:block;font-family:var(--round);font-size:20px;font-variant-numeric:tabular-nums}
.target-grid span{font-size:11px;color:var(--label2);text-transform:uppercase;letter-spacing:.3px}
.plan-item{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:15px}
.plan-item .e{font-size:20px;width:28px;text-align:center;flex:none}
.plan-item .k{color:var(--label2);font-variant-numeric:tabular-nums}
.rules{margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;padding:10px 16px;align-items:flex-start;position:relative}
.rules li+li::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:.5px solid var(--sep)}
.rules .dot{width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;flex:none;margin-top:1px}
.rules .dot svg{width:14px;height:14px}

/* Diary */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:14px}
.stat .k{font-size:13px;color:var(--label2);font-weight:500}
.stat .v{font-family:var(--round);font-size:26px;font-weight:600;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:13px;color:var(--label2);font-weight:500}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--label2);font-size:11px;font-family:var(--font)}
.food-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.food-tile{background:var(--card);border-radius:16px;padding:10px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.food-tile .ph{aspect-ratio:1;max-width:100%;border-radius:11px;background:var(--fill);display:grid;place-items:center;font-size:34px;overflow:hidden}
.food-tile .ph img{width:100%;height:100%;object-fit:cover}
.food-tile .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-tile .k{font-size:12px;color:var(--label2)}
.hist{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left;position:relative}
.hist+.hist::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.hist .d{flex:1;text-transform:capitalize}
.minibar{width:80px;height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.minibar i{display:block;height:100%;background:var(--r-move)}

/* Toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:80;transform:translate(-50%,-140%) ;background:var(--card);color:var(--label);box-shadow:0 10px 40px rgba(0,0,0,.18);border-radius:22px;padding:10px 18px;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px;transition:transform .45s cubic-bezier(.2,1.2,.3,1);max-width:calc(100% - 32px)}
.toast.show{transform:translate(-50%,0)}

.cube .f2{transform:rotateY(90deg) translateZ(60px);background:linear-gradient(145deg,#7BED9F,#34C759)}
.cube .f3{transform:rotateY(180deg) translateZ(60px);background:linear-gradient(145deg,#FFC66B,#FF9500)}
.cube .f4{transform:rotateY(-90deg) translateZ(60px);background:linear-gradient(145deg,#FFE66B,#FFCC00)}
.cube .f5{transform:rotateX(90deg) translateZ(60px);background:linear-gradient(145deg,#C58CFF,#AF52DE)}
.cube .f6{transform:rotateX(-90deg) translateZ(60px);background:linear-gradient(145deg,#8CF0B0,#30B0C7)}
.cube-shadow{position:absolute;left:10%;right:10%;bottom:-34px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);animation:shadow 3s ease-in-out infinite}
@keyframes cube{0%{transform:rotateX(-24deg) rotateY(0) translateY(0)}25%{transform:rotateX(-12deg) rotateY(90deg) translateY(-6px)}50%{transform:rotateX(-24deg) rotateY(180deg) translateY(0)}75%{transform:rotateX(-12deg) rotateY(270deg) translateY(-6px)}100%{transform:rotateX(-24deg) rotateY(360deg) translateY(0)}}
@keyframes shadow{50%{transform:scaleX(.85);opacity:.7}}
.splash{min-height:70vh;display:grid;place-items:center;text-align:center}
.welcome h1{font-size:40px;font-weight:800;letter-spacing:.2px;margin:48px 0 6px;text-align:center}
.welcome .tag{text-align:center;color:var(--label2);font-size:17px;margin:0 auto;max-width:34ch;text-wrap:balance}

.scan-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}

.scan-title{font-weight:600}
.scan-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 16px;min-height:0}

.plate img{width:100%;height:100%;object-fit:cover;display:block}
.plate .idle{position:absolute;inset:0;display:grid;place-items:center;font-size:84px;filter:drop-shadow(0 10px 20px rgba(0,0,0,.5))}
.grid3d{position:absolute;inset:0;border-radius:30px;background-image:linear-gradient(rgba(48,209,88,.28) 1px,transparent 1px),linear-gradient(90deg,rgba(48,209,88,.28) 1px,transparent 1px);background-size:22px 22px;opacity:.5;transform:translateZ(8px);pointer-events:none}

.corner.tl{top:-12px;left:-12px;border-right:0;border-bottom:0;border-top-left-radius:16px}
.corner.tr{top:-12px;right:-12px;border-left:0;border-bottom:0;border-top-right-radius:16px}
.corner.bl{bottom:-12px;left:-12px;border-right:0;border-top:0;border-bottom-left-radius:16px}
.corner.br{bottom:-12px;right:-12px;border-left:0;border-top:0;border-bottom-right-radius:16px}

.orbit::after{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#6CFF9A;box-shadow:0 0 14px 4px rgba(108,255,154,.8)}

.orbit.c{inset:-28px;border-color:rgba(250,17,79,.3);animation:orbC 5.5s linear infinite}

.mini-step{display:flex;align-items:center;gap:4px;flex:none}

/* ---------- targets ---------- */
function ageOf(p){
  if (!p) return 0;
  if (p.birth) {
    const b = parseKey(p.birth), n = new Date();
    let a = n.getFullYear() - b.getFullYear();
    if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
    return a;
  }
  return +p.age || 0;
}
function tierOf(age){ return age < 14 ? 'kid' : age < 18 ? 'teen' : age < 65 ? 'adult' : 'senior'; }
function targets(p){
  const age = ageOf(p), w = +p.weight, h = +p.height, male = p.sex === 'M', act = +p.activity || 0;
  const tier = tierOf(age);
  let bmr, kcal, note = '';
  const bmi = w / Math.pow(h / 100, 2);
  if (age < 18) {
    bmr = age < 10 ? (male ? 22.706*w + 504.3 : 20.315*w + 485.9) : (male ? 17.686*w + 658.2 : 13.384*w + 692.6);
    kcal = bmr * [1.45,1.6,1.75,1.9][act];
    note = 'Chi sta crescendo ha bisogno di tutta l\'energia per il suo corpo: niente diete, solo pasti equilibrati.';
  } else {
    bmr = 10*w + 6.25*h - 5*age + (male ? 5 : -161);
    kcal = bmr * [1.2,1.375,1.55,1.725][act];
    if (p.goal === 'lose') {
      if (bmi < 18.5) note = 'Con un indice di massa corporea sotto 18,5 dimagrire non è consigliato: il piano resta di mantenimento.';
      else kcal = Math.max(kcal * .85, male ? 1500 : 1200);
    }
    if (p.goal === 'gain') kcal *= 1.1;
  }
  kcal = Math.round(clamp(kcal, 1200, 4200) / 10) * 10;
  const perKg = tier === 'kid' ? .95 : tier === 'teen' ? .9 : tier === 'senior' ? 1.1 : (p.goal === 'lose' || p.goal === 'gain') ? 1.3 : 1.0;
  const protein = Math.round(w * perKg);
  const fat = Math.round(kcal * .3 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein*4 - fat*9) / 4));
  const water = age < 14 ? 7 : male ? 10 : 8;
  return { kcal, protein, fat, carbs, water, fv:5, bmr:Math.round(bmr), bmi, tier, note };
}

function buildPlan(k){
  const g = T(); const base = Math.floor(parseKey(k).getTime() / 864e5) + S.planShift;
  return SLOTS.map((sl, si) => {
    const opts = PLAN[sl.s]; const opt = opts[((base + si) % opts.length + opts.length) % opts.length];
    const rawK = opt.reduce((a, [key, gr]) => a + FOOD[key].kcal * gr / 100, 0);
    const factor = clamp(g.kcal * sl.share / rawK, .6, 2.2);
    const items = opt.map(([key, gr]) => entryFrom(srcFromDb(FOOD[key]), Math.max(5, Math.round(gr * factor / 5) * 5)));
    return { label: sl.l, meal: sl.meal, items };
  });
}

/* ---- diary ---- */
function streak(){
  let k = todayKey(), n = 0;
  if (!totals(getDay(k)).n) k = addDays(k, -1);
  while (totals(getDay(k)).n) { n++; k = addDays(k, -1); if (n > 999) break; }
  return n;
}
function renderDiary(){
  const g = T(), today = todayKey();
  const week = Array.from({length:7}, (_, i) => addDays(today, i - 6)).map(k => ({ k, t: totals(getDay(k)) }));
  const logged = week.filter(d => d.t.n);
  const avg = logged.length ? logged.reduce((a, d) => a + d.t.kcal, 0) / logged.length : 0;
  const avgFv = logged.length ? logged.reduce((a, d) => a + d.t.fv, 0) / logged.length : 0;
  const W = 340, H = 170, top = 16, bottom = 26, left = 6, right = 6;
  const maxV = Math.max(g.kcal * 1.25, ...week.map(d => d.t.kcal));
  const y = v => top + (H - top - bottom) * (1 - v / maxV);
  const bw = (W - left - right) / 7;
  const bars = week.map((d, i) => {
    const x = left + i * bw + bw * .22, w = bw * .56, yy = y(d.t.kcal), h = Math.max(0, H - bottom - yy);
    return `<rect x="${x.toFixed(1)}" y="${(d.t.kcal ? yy : H - bottom - 3).toFixed(1)}" width="${w.toFixed(1)}" height="${(d.t.kcal ? h : 3).toFixed(1)}" rx="${Math.min(6, w/2).toFixed(1)}" style="fill:${d.t.kcal ? 'var(--r-move)' : 'var(--fill2)'}" ${d.k === today ? '' : 'fill-opacity=".75"'}/>` +
      `<text x="${(left + i*bw + bw/2).toFixed(1)}" y="${H - 8}" text-anchor="middle" ${d.k === today ? 'style="fill:var(--label);font-weight:600"' : ''}>${esc(shortDay(d.k))}</text>`;
  }).join('');
  const ty = y(g.kcal);
  const chart = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorie degli ultimi sette giorni rispetto all'obiettivo di ${fmt(g.kcal)} kcal">
    <line x1="${left}" x2="${W-right}" y1="${H-bottom}" y2="${H-bottom}" style="stroke:var(--sep)"/>
    ${bars}
    <line x1="${left}" x2="${W-right}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}" style="stroke:var(--label2)" stroke-dasharray="4 4"/>
    <text x="${W-right}" y="${(ty - 5).toFixed(1)}" text-anchor="end">obiettivo ${fmt(g.kcal)}</text></svg>`;
  const hist = Array.from({length:14}, (_, i) => addDays(today, -i)).map(k => ({ k, t: totals(getDay(k)) })).filter(d => d.t.n);
  app.innerHTML = `
  ${header('Ultimi 7 giorni', 'Diario')}
  <div class="stats" style="margin-top:14px">
    <div class="card stat hot"><div class="k">Serie</div><div class="v">${streak()}<small> giorni</small></div></div>
    <div class="card stat"><div class="k">Media</div><div class="v">${fmt(avg)}<small> kcal</small></div></div>
    <div class="card stat"><div class="k">Frutta e verd.</div><div class="v">${fmt1(avgFv)}<small> /giorno</small></div></div>
  </div>
  <div class="card pad" style="margin-top:12px">${chart}</div>
  <h2 class="section-title">I miei cibi <small>${S.foods.length}</small></h2>
  ${S.foods.length ? `<div class="food-grid">${S.foods.map(f => `<button class="food-tile" data-a="food" data-id="${esc(f.id)}"><span class="ph">${f.thumb ? `<img src="${esc(f.thumb)}" alt="">` : esc(f.emoji || '🍽️')}</span><span class="n">${esc(f.name)}</span><span class="k num">${fmt(f.kcal)} kcal · ${fmt(f.grams)} g</span></button>`).join('')}</div>`
    : `<div class="card pad muted">Quando scansioni un piatto puoi memorizzarlo qui, per riaggiungerlo con un tocco.</div>`}
  <h2 class="section-title">Giorni registrati</h2>
  ${hist.length ? `<div class="card">${hist.map(d => `<button class="hist" data-a="goto" data-k="${d.k}"><span class="d">${esc(d.k === today ? 'Oggi' : longDate(d.k))}</span><span class="minibar"><i style="width:${clamp(d.t.kcal/g.kcal*100,0,100)}%"></i></span><span class="muted num" style="min-width:74px;text-align:right">${fmt(d.t.kcal)} kcal</span></button>`).join('')}</div>`
    : `<div class="card pad muted">Nessun giorno registrato nelle ultime due settimane.</div>`}`;
}

async function prepImage(file){
  const url = URL.createObjectURL(file);
  const img = new Image(); img.src = url;
  await img.decode();
  const W = img.naturalWidth, H = img.naturalHeight, side = Math.min(W, H);
  const t = document.createElement('canvas'); t.width = t.height = 112;
  t.getContext('2d').drawImage(img, (W - side)/2, (H - side)/2, side, side, 0, 0, 112, 112);
  const sq = document.createElement('canvas'); sq.width = sq.height = 320;   // ritaglio centrale per il riconoscimento
  sq.getContext('2d').drawImage(img, (W - side)/2, (H - side)/2, side, side, 0, 0, 320, 320);
  return { url, square: sq, thumb: t.toDataURL('image/jpeg', .7) };
}

  'globe artichoke':'carciofi','butternut squash':'zucca','acorn squash':'zucca','spaghetti squash':'zucca','mashed potato':'pure','guacamole':'guacamole',
  'pizza':'pizza','pizza pie':'pizza','cheeseburger':'burger','hotdog':'hotdog','hot dog':'hotdog','red hot':'hotdog','burrito':'burrito','carbonara':'carbonara',

  'hot pot':'stufato','hotpot':'stufato','chocolate sauce':'cioccolata','chocolate syrup':'cioccolata','eggnog':'latte','soup bowl':'minestrone',
};
const DISH_HINTS = ['plate','soup bowl','mixing bowl','tray','wok','frying pan','dining table','restaurant','bakery','grocery store','ladle','spatula','coffee mug','cup'];
let modelP = null;
function loadScript(src){ return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(el); }); }
function ensureModel(){
  if (!modelP) modelP = (async () => {
    if (!window.tf) await loadScript('vendor/tf.min.js');

const itemFromFood = (f, grams, conf, on) => ({ id:rid(), name:f.name, emoji:f.emoji, grams, base:grams, k:f.kcal/100, pp:f.p/100, cc:f.c/100, ff:f.f/100, fvv:f.fv ? 1/130 : 0, conf, on });
async function recognizePhoto(canvas){
  const model = await ensureModel();
  const preds = await model.classify(canvas, 12);
  const score = {}; let dish = 0;
  preds.forEach(pr => {
    const names = pr.className.toLowerCase().split(/,\s*/);
    const key = names.map(n => LABELS[n]).find(Boolean);
    if (key) score[key] = (score[key] || 0) + pr.probability;
    else if (names.some(n => DISH_HINTS.includes(n))) dish += pr.probability;
  });
  const ranked = Object.entries(score).filter(([, p]) => p >= .04).sort((a, b) => b[1] - a[1]).slice(0, 4);
  // sotto il 25% non scegliamo al posto tuo: proponiamo le alternative
  return { items: ranked.map(([k, p], i) => itemFromFood(FOOD[k], FOOD[k].portion, p, i === 0 && p >= .25)), dish };
}

/* description in words: «2 uova, 50 g di pane e un'insalata» */
const KW = {
  latte:['latte'], latteint:['latte intero'], pasta:['pasta','spaghetti','penne','fusilli','maccheroni'], pastaint:['pasta integrale'], riso:['riso','risotto'],
  pastapom:['pasta al pomodoro','spaghetti al pomodoro','pasta al sugo'], pollo:['pollo','petto di pollo'], manzo:['manzo','carne','bistecca'], burger:['hamburger','panino'],
  crudo:['prosciutto crudo','prosciutto'], cotto:['prosciutto cotto'], uova:['uovo','uova','frittata'], olio:['olio'], yogurt:['yogurt'], greco:['yogurt greco'],
  avena:['avena','porridge'], biscotti:['biscotti','biscotto'], cornetto:['cornetto','brioche','croissant'], succo:['succo'], bibita:['bibita','coca cola','cola','aranciata'],
  patate:['patate','patata'], pomodori:['pomodoro','pomodori'], fette:['fette biscottate'], crackers:['crackers','cracker'], fondente:['cioccolato'],
  caffe:['caffè','caffe','espresso'], pure:['purè','pure'], bosco:['mirtilli','lamponi','frutti di bosco'], minestrone:['minestrone','minestra','zuppa'],
  lasagne:['lasagne','lasagna'], carbonara:['carbonara'], insalata:['insalata'], pane:['pane','pagnotta','panino al latte'], paneint:['pane integrale'],
  fagioli:['fagioli'], ceci:['ceci'], lenticchie:['lenticchie'], tonno:['tonno'], salmone:['salmone'], merluzzo:['merluzzo','pesce'], gamberi:['gamberi','gamberetti'],
  mozzarella:['mozzarella'], parmigiano:['parmigiano','grana'], ricotta:['ricotta'], gelato:['gelato'], mela:['mela','mele'], pizza:['pizza','pizzetta'],
};
const NUMW = { 'un':1, 'uno':1, 'una':1, "un'":1, 'due':2, 'tre':3, 'quattro':4, 'cinque':5, 'sei':6, 'mezzo':.5, 'mezza':.5 };
function parseDescription(text){
  let t = ' ' + text.toLowerCase().replace(/[’`]/g, "'") + ' ';
  const pairs = [];
  FOODS.forEach(f => {
    const base = f.name.toLowerCase().replace(/\s*\(.*?\)\s*/g, '').replace(/\./g, '').trim();
    new Set([base, ...(KW[f.key] || [])]).forEach(kw => pairs.push([kw, f]));
  });
  pairs.sort((a, b) => b[0].length - a[0].length);
  const found = [];
  for (const [kw, f] of pairs) {
    const stem = kw.includes(' ') ? kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') : kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/[aeio]$/, '') + '[aeio]?';
    const re = new RegExp("(^|[^a-zàèéìòù])(" + stem + ")(?=$|[^a-zàèéìòù])");
    const m = re.exec(t); if (!m) continue;
    const start = m.index + m[1].length, end = start + m[2].length;
    if (found.some(x => x.f.key === f.key)) { t = t.slice(0, start) + ' '.repeat(end - start) + t.slice(end); continue; }
    const before = t.slice(Math.max(0, start - 40), start);
    let grams = f.portion; const piece = PIECE[f.key] || f.portion;
    const mq = /(\d+(?:[.,]\d+)?)\s*(kg|g|gr|grammi|ml|l|litri?)?\.?\s*(?:[a-zàèéìòù']+\s+){0,2}(?:di\s+|d')?$/.exec(before);
    const mw = /(?:^|\s)(un'|un|uno|una|due|tre|quattro|cinque|sei|mezzo|mezza)\s*(?:[a-zàèéìòù']+\s+){0,2}(?:di\s+|d')?$/.exec(before);
    if (mq) { const n = parseFloat(mq[1].replace(',', '.')); const u = mq[2] || ''; grams = /^(g|gr|grammi|ml)$/.test(u) ? n : /^(kg|l|litr)/.test(u) ? n * 1000 : n * piece; }
    else if (mw) grams = NUMW[mw[1]] * piece;
    found.push({ f, grams: clamp(Math.round(grams), 1, 3000), at:start });
    t = t.slice(0, start) + ' '.repeat(end - start) + t.slice(end);
  }
  return found.sort((a, b) => a.at - b.at).slice(0, 8).map(x => itemFromFood(x.f, x.grams, null, true));
}

      <button class="btn tinted" data-a="scan-manual">Non è giusto? Cerca nell'elenco</button>
      <button class="btn tinted" data-a="scan-again">Scansiona un altro piatto</button>
    </div>
    <p class="foot">${SC.items.some(x => x.conf != null) ? 'La percentuale indica quanto è sicuro il riconoscimento. Tocca il cerchio per scegliere i cibi giusti e correggi le porzioni con − e +.' : 'Porzioni stimate dalla descrizione: correggile con − e +.'}</p>
  </div>`;
  $('#memo').addEventListener('change', e => SC.memo = e.target.checked);
}

/* ---------- events ---------- */
const actions = {
  tab: el => { S.view = el.dataset.v; closeSheet(); render(); window.scrollTo(0, 0); },
  day: el => { const d = +el.dataset.d; S.date = d === 0 ? todayKey() : addDays(S.date, d); if (S.date > todayKey()) S.date = todayKey(); render(); },
  goto: el => { S.date = el.dataset.k; S.view = 'today'; render(); window.scrollTo(0, 0); },
  water: el => { const d = ensureDay(S.date); const i = +el.dataset.i; d.water = (d.water || 0) === i + 1 ? i : i + 1; saveDay(S.date); renderToday(); if (d.water === T().water) toast('Obiettivo acqua raggiunto!'); },
  quote: () => {
    const next = pickQuote(); S.currentQuote = next;
    const inner = $('.flip-inner'); const hidden = S.quoteDeg % 360 === 0 ? $('#qb') : $('#qa');
    hidden.querySelector('.q').textContent = next;
    S.quoteDeg += 180; inner.style.transform = `rotateY(${S.quoteDeg}deg)`;
  },
  'add-open': el => openAdd(el.dataset.m),
  'add-tab': el => { A.tab = el.dataset.t; renderAdd(); },
  'add-pick-db': el => { A.src = srcFromDb(FOOD[el.dataset.k]); A.grams = A.src.grams; renderAdd(); },
  'add-pick-my': el => { const f = S.foods.find(x => x.id === el.dataset.id); if (!f) return; A.src = srcFromSaved(f); A.grams = A.src.grams; renderAdd(); },
  'g-step': el => { A.grams = clamp(Math.round((A.grams + +el.dataset.d) / 5) * 5, 5, 5000); $('#gramsIn').value = A.grams; $('#nutriBox').innerHTML = nutriHtml(entryFrom(A.src, A.grams)); },
  'add-meal': el => { A.meal = el.dataset.m; renderAdd(); },
  'add-confirm': () => { if (!(A.grams > 0)) return; addEntries(A.meal, [entryFrom(A.src, A.grams)]); closeSheet(); },
  'sheet-close': () => { if ($('#addRoot') && A.src && !A.fromOutside) { A.src = null; renderAdd(); return; } A.fromOutside = false; closeSheet(); },
  entry: el => openEntry(el.dataset.m, el.dataset.id),
  'entry-del': el => { const d = ensureDay(S.date); d.meals[el.dataset.m] = d.meals[el.dataset.m].filter(e => e.id !== el.dataset.id); saveDay(S.date); closeSheet(); renderToday(); toast('Eliminato dal diario'); },
  'entry-memo': el => { const e = getDay(S.date).meals[el.dataset.m].find(x => x.id === el.dataset.id); if (e) { saveFoodMemo(e); toast('Memorizzato nei miei cibi'); } closeSheet(); },
  food: el => openSavedFood(el.dataset.id),
  'food-add': el => { const f = S.foods.find(x => x.id === el.dataset.id); if (!f) return; closeSheet(true); S.date = todayKey(); openAdd(autoMeal(), srcFromSaved(f)); A.fromOutside = true; },
  'food-del': el => { S.foods = S.foods.filter(f => f.id !== el.dataset.id); Store.del('food-' + el.dataset.id); closeSheet(); renderDiary(); toast('Rimosso dai miei cibi'); },
  'plan-add': el => {
    const day = getDay(S.date); const meals = day.plan && day.plan.meals ? day.plan.meals : buildPlan(S.date);
    const m = meals[+el.dataset.i]; if (!m) return;
    addEntries(m.meal, m.items.map(e => ({ ...e, id:rid() })), true); toast(`${m.label} aggiunto al diario`);
  },
  'plan-shuffle': () => { S.planShift++; renderPlan(); },
  'plan-reset': () => { const d = ensureDay(S.date); delete d.plan; saveDay(S.date); renderPlan(); },
  'edit-profile': () => { openSheet(`${sheetHead('Profilo')}<div class="sheet-body">${profileForm(S.profile)}</div>`); bindProfileForm(sheetEl); },
  'reset-ask': () => { $('#resetBox').innerHTML = `<p class="note" style="margin:0 0 10px">Vuoi cancellare profilo, diario e cibi memorizzati? L'operazione non si può annullare.</p><div class="stack"><button class="btn danger" data-a="reset-yes" style="background:var(--red);color:#fff">Sì, cancella tutto</button><button class="btn tinted" data-a="tab" data-v="profile">Annulla</button></div>`; },
  'reset-yes': () => {
    Store.del('profile'); Object.keys(S.days).forEach(k => Store.del('day-' + k)); S.foods.forEach(f => Store.del('food-' + f.id));
    S.profile = null; S.days = {}; S.foods = []; S.view = 'today'; S.date = todayKey();
    try { localStorage.removeItem(LKEY); } catch (e) {}
    render(); window.scrollTo(0, 0);
  },
  scan: () => { S.date = S.date || todayKey(); openScanner(); },
  'scan-close': () => closeScanner(),
  'cam-shot': () => snapCamera(),
  'scan-again': () => { SC.run = (SC.run || 0) + 1; SC.state = 'idle'; SC.img = null; SC.desc = ''; SC.items = []; renderScanner(); if (SC.camOff) actions['pick-photo'](); else startCamera(); },
  export: () => exportData(),
  import: () => { const inp = $('#backupInput'); inp.value = ''; inp.click(); },
  'import-yes': () => { const d = S.pendingImport; if (!d) return; S.profile = d.profile; S.days = d.days || {}; S.foods = d.foods || []; S.pendingImport = null; Store.saveNow(); S.view = 'today'; S.date = todayKey(); render(); window.scrollTo(0, 0); toast('Backup importato'); },
  'scan-describe': () => { stopCamera(); SC.state = 'describe'; renderScanner(); },
  'scan-desc-go': () => { const t = ($('#scanDesc')?.value || '').trim(); if (!t) { $('#scanDesc')?.focus(); return; } SC.desc = t.slice(0, 400); runScan(); },
  'scan-stop': () => { SC.run = (SC.run || 0) + 1; SC.state = SC.desc ? 'describe' : 'idle'; SC.img = null; renderScanner(); if (SC.state === 'idle') startCamera(); },
  'pick-photo': () => { stopCamera(); const inp = $('#photoInput'); inp.value = ''; inp.click(); },
  'scan-manual': () => { const thumb = SC.thumb; closeScanner(); openAdd(SC.meal); A.pendingThumb = thumb; },
  'res-toggle': el => { const x = SC.items.find(i => i.id === el.dataset.id); if (x) { x.on = !x.on; SC.touched = true; renderResult(); } },
  'res-step': el => { const x = SC.items.find(i => i.id === el.dataset.id); if (!x) return; const step = Math.max(5, Math.round(x.base * .1 / 5) * 5); x.grams = clamp(x.grams + step * +el.dataset.d, step, 3000); renderResult(); },
  'res-meal': el => { SC.meal = el.dataset.m; renderResult(); },
  'res-add': () => {
    const entries = SC.items.filter(x => x.on).map(itemEntry); if (!entries.length) return;
    if (SC.memo) entries.forEach(saveFoodMemo);
    const dateBefore = S.date; if (S.view !== 'today') { S.view = 'today'; }
    addEntries(SC.meal, entries, true);
    closeScanner(); S.date = dateBefore; render(); window.scrollTo(0, 0);
    toast(`${SC.memo ? 'Aggiunto e memorizzato' : 'Aggiunto'} · ${fmt(entries.reduce((a, e) => a + e.kcal, 0))} kcal`);
    SC.quote = null;
  },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = actions[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.a === 'quote') e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset && e.target.dataset.a === 'quote') { e.preventDefault(); actions.quote(); }
  if (e.key === 'Escape') { if (sheetEl) closeSheet(); else if (scanner.classList.contains('show')) closeScanner(); }
});
$('#photoInput').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) handlePhoto(f); else if (SC.state === 'idle') startCamera(); });
$('#backupInput').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  let d = null; try { d = JSON.parse(await f.text()); } catch (err) {}
  if (!d || d.app !== 'piattino' || typeof d.days !== 'object' || !d.profile) { toast('Questo file non è un backup di Piattino.', true); return; }
  S.pendingImport = d;
  const when = d.exported ? new Date(d.exported).toLocaleDateString('it-IT', { day:'numeric', month:'long', year:'numeric' }) : '';
  const box = $('#backupBox'); if (!box) return;
  box.innerHTML = `<p class="note" style="margin:0">Vuoi sostituire i dati di questo dispositivo con il backup${when ? ' del ' + esc(when) : ''}? Contiene ${Object.keys(d.days).length} giorni e ${(d.foods || []).length} cibi memorizzati.</p><button class="btn primary" data-a="import-yes">Importa e sostituisci</button><button class="btn tinted" data-a="tab" data-v="profile">Annulla</button>`;
});
async function exportData(){
  Store.saveNow();
  const data = JSON.stringify({ app:'piattino', v:1, exported:new Date().toISOString(), profile:S.profile, days:S.days, foods:S.foods });
  const name = `piattino-backup-${todayKey()}.json`;
  const file = new File([data], name, { type:'application/json' });
  try { if (navigator.canShare && navigator.canShare({ files:[file] })) { await navigator.share({ files:[file], title:'Backup Piattino' }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Backup esportato');
}

/* attach the scan photo to an item chosen from the list after a failed recognition */
const origAdd = actions['add-confirm'];
actions['add-confirm'] = () => {
  if (A.pendingThumb && A.src && !A.src.thumb) A.src = { ...A.src, thumb: A.pendingThumb };
  A.pendingThumb = null; origAdd();
};

/* ---------- boot ---------- */
const st = Store.load();
S.profile = st.profile; S.days = st.days; S.foods = st.foods;
render();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
})();
</script>
</body>
</html>
